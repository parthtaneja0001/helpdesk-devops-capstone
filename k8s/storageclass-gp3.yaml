# EKS 1.31 ships only the legacy in-tree "gp2" class (not default). This default class uses the
# EBS CSI driver installed by Terraform so the PostgreSQL PVC can be provisioned.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
