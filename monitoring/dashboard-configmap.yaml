apiVersion: v1
kind: ConfigMap
metadata:
  name: helpdesk-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  helpdesk.json: |
    {
      "title": "HelpDesk API",
      "uid": "helpdesk-api",
      "schemaVersion": 39,
      "time": { "from": "now-30m", "to": "now" },
      "refresh": "10s",
      "panels": [
        {
          "type": "timeseries", "title": "Requests per second by handler",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum by (handler) (rate(http_requests_total{namespace=\"helpdesk\"}[1m]))", "legendFormat": "{{handler}}" }]
        },
        {
          "type": "timeseries", "title": "p95 latency (s)",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [{ "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"helpdesk\"}[5m])))", "legendFormat": "p95" }]
        },
        {
          "type": "timeseries", "title": "5xx error rate",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum(rate(http_requests_total{namespace=\"helpdesk\",status=\"5xx\"}[1m]))", "legendFormat": "5xx/s" }]
        },
        {
          "type": "stat", "title": "Backend pods up",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum(up{namespace=\"helpdesk\",service=\"helpdesk-backend\"})" }]
        }
      ]
    }
