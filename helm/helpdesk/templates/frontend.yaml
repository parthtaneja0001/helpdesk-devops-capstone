apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "helpdesk.selector" (dict "ctx" $ "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helpdesk.selector" (dict "ctx" $ "component" "frontend") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            - name: BACKEND_URL
              value: http://{{ .Release.Name }}-backend:{{ .Values.backend.port }}
          livenessProbe:
            httpGet: { path: /nginx-health, port: http }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /nginx-health, port: http }
            initialDelaySeconds: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "helpdesk.selector" (dict "ctx" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
